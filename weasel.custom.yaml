皮肤背景: &皮肤背景 0x131824
皮肤文字: &皮肤文字 0xc9cdd4
皮肤选中背景: &皮肤选中背景 0xebb10d
皮肤选中文字: &皮肤选中文字 0x131824
字体: &字体 "Twitter Color Emoji, HarmonyOS Sans SC Black, TumanPUA, 汉仪跑男体, 霞鹜漫黑, MiSans:Light, MiSans TC, 新雅黑"

patch:
  preset_color_schemes:
    moreless:
      name: 极简
      author: 九
      color_format: rgba
      back_color: 0x1e232bf2
      border_color: 0x2a303a
      text_color: 0xffffff
      comment_text_color: 0x333333
      label_color: 0x4da3ff
      hilited_candidate_text_color: 0xffffff
      hilited_candidate_back_color: 0x2d7dff
      hilited_comment_text_color: 0xffffff
      hilited_label_color: 0xffffff
      shadow_color: 0x00000033
    ayaya_night:
      name: "文文·夜／Ayaya Night"
      author: "ksqsf <i@ksqsf.moe>"
      back_color: 0x1E1E1E
      border_color: 0xFF303030
      candidate_text_color: 0xAAA6F0
      comment_text_color: 0xAAA6F0
      hilited_back_color: 0xAAA6F0
      hilited_candidate_back_color: 0xA996F1
      hilited_candidate_text_color: 0x1E1E1E
      hilited_comment_text_color: 0x1E1E1E
      hilited_label_color: 0x1E1E1E
      hilited_mark_color: 0xF9F9F9
      hilited_text_color: 0xFFFFFF
      label_color: 0xAAA6F0
      text_color: 0xFFFFFF


  style:
    color_scheme: moreless
    # horizontal: true
    inline_preedit: true
    font_face: 鸿蒙黑体
    font_point: 20
    label_font_point: 16
    # font_point: 40
    # label_font_point: 14
    layout:
      # 下面两个参数用于调整emoji对齐问题
      baseline: 100
      linespacing: 140

      max_width: 0
      max_height: 0
      min_width: 0
      min_height: 0
      corner_radius: 6
      margin_x: 28
      margin_y: 14
      candidate_spacing: 0
      border_width: 1
      hilite_spacing: 8 # 文字和序号的间距
      hilite_padding_x: 20
      hilite_padding_y: 6
      hilited_corner_radius: 6
      shadow_radius: 12
      shadow_offset_x: 4
      shadow_offset_y: 16
      align_type: center

  app_options/+:
    windowsterminal.exe:
      ascii_mode: true
