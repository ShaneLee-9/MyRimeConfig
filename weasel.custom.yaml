皮肤背景: &皮肤背景 0x131824
皮肤文字: &皮肤文字 0xc9cdd4
皮肤选中背景: &皮肤选中背景 0xebb10d
皮肤选中文字: &皮肤选中文字 0x131824
字体: &字体 "方正悠黑_GBK 508R, 霞鹜新致宋 屏幕阅读版 补全, TW-Kai, 汉仪跑男体, 霞鹜漫黑, MiSans:Light, MiSans TC, MiSansL3, 新雅黑"

patch:
  preset_color_schemes:
    moreless:
      name: 极简
      author: 九
      color_format: rgba
      back_color: 0xeceff4
#      border_color: 0xe1e1e1
      border_color: 0xc8c9cc66
      text_color: 0x89a0be
      comment_text_color: 0x9eb0c8
      label_color: 0x9eb0c8
      hilited_candidate_text_color: 0x6780a8
      hilited_candidate_back_color: 0xd9dee8
      hilited_comment_text_color: 0xa6b1c3
      hilited_label_color: 0x6780a8
      shadow_color: 0x0000001a

  style:
    color_scheme: moreless
    horizontal: true
    inline_preedit: true
    font_face: *字体
    font_point: 20
    label_font_point: 14
    layout:
      # 下面两个参数用于调整emoji对齐问题
      baseline: 100
      linespacing: 140

      max_width: 0
      max_height: 0
      min_width: 0
      min_height: 0
      corner_radius: 8
      margin_x: 16
      margin_y: 8
      border_width: 2
      hilite_padding_x: 12
      hilite_padding_y: 4
      hilited_corner_radius: 8
      shadow_radius: 8
      shadow_offset_x: 4
      shadow_offset_y: 4
      align_type: center

  app_options/+:
    windowsterminal.exe:
      ascii_mode: true
